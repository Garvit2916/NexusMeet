# Render blueprint: API only. The frontend is deployed to Vercel, so the
# Next.js service that used to live here is intentionally not defined.
#
# The free plan has no persistent disk, so SQLite lives in /tmp and is recreated
# on every cold start. `alembic upgrade head` builds the schema and the
# idempotent seed recreates the demo account, so the app always boots clean.
# Upgrade this service to the starter plan and re-add the `disk` block below
# when you need meeting data to survive restarts.
services:
  - type: web
    name: nexusmeet-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Ephemeral by design on the free plan. For the starter plan use the
      # persistent disk instead: sqlite:////data/nexusmeet.db
      - key: DATABASE_URL
        value: sqlite:////tmp/nexusmeet.db
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      # SESSION_COOKIE_SECURE is intentionally not set. Leaving it unset makes
      # the API issue Secure cookies because ENVIRONMENT=production. Setting it
      # to an empty string is not the same thing and fails settings validation.
      - key: DEFAULT_USER_NAME
        value: Demo User
      - key: DEFAULT_USER_EMAIL
        value: demo@nexusmeet.app
      - key: DEFAULT_USER_PASSWORD
        sync: false
      # --- Real-time media (WebRTC signaling) ---------------------------------
      # Signs the short-lived tickets that authorize a WebSocket handshake.
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      # Until this is set, /ws-ticket answers 503 SIGNALING_NOT_CONFIGURED in
      # production, so media stays off instead of running on a forgeable key.
      - key: WS_TICKET_SECRET
        sync: false
      # Must be the externally reachable ws:// or wss:// origin of THIS service.
      # Browsers cannot follow the Vercel REST rewrite for a WebSocket upgrade,
      # so the ticket has to point at Render directly. Use wss:// in production.
      - key: PUBLIC_WS_URL
        value: wss://nexusmeet-api.onrender.com
      # Full mesh is peer-to-peer, so this is a room capacity guard, not a
      # server media limit. Each additional participant adds one connection to
      # every browser, so keep it modest.
      - key: MAX_WEBRTC_PARTICIPANTS
        value: "6"
      - key: WS_TICKET_TTL_SECONDS
        value: "60"
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      # TURN is what makes media work behind symmetric NAT and restrictive
      # firewalls. STUN only discovers public addresses, it cannot relay media,
      # so with TURN_URL empty two browsers on some real networks will never
      # connect no matter how long they retry. Set all three values.
      # Credentials are issued to clients through the authenticated ticket
      # endpoint and are never bundled into the frontend.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
