services:
  - type: web
    name: nexusmeet-api
    runtime: python
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: nexusmeet-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/nexusmeet.db
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "false"
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      # Leave empty to enable secure cookies automatically when ENVIRONMENT=production
      - key: SESSION_COOKIE_SECURE
        value: ""
      - key: DEFAULT_USER_NAME
        value: Demo User
      - key: DEFAULT_USER_EMAIL
        value: demo@nexusmeet.app
      - key: DEFAULT_USER_PASSWORD
        sync: false

  - type: web
    name: nexusmeet-web
    runtime: node
    plan: starter
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
