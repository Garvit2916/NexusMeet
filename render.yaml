services:
  - type: web
    name: nexusmeet-api
    runtime: python
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: nexusmeet-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/nexusmeet.db
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "false"
      - key: DEFAULT_USER_NAME
        value: Demo User
      - key: DEFAULT_USER_EMAIL
        value: demo@nexusmeet.local

  - type: web
    name: nexusmeet-web
    runtime: node
    plan: starter
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
